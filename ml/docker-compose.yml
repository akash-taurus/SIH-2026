services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://sih:sih@db:5432/sih26001
    depends_on:
      - db
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sih
      POSTGRES_PASSWORD: sih
      POSTGRES_DB: sih26001
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
